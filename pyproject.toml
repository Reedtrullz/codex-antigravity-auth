[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-antigravity-auth"
version = "2.4.3"
description = "Google Antigravity OAuth model access for OpenAI Codex"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["codex", "google-antigravity", "oauth", "responses-api", "byok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.28.1",
  "fastapi>=0.142.2",
  "uvicorn>=0.28",
  "keyring>=25.0.0",
  "cryptography>=50.0.2",
  "tomlkit>=0.13.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
  "ruff>=0.16.9",
  "tomli>=2.0.1; python_version < '3.11'",
  "jsonschema>=4.23",
]

quality = ["pip-audit>=2.10.1"]

[project.scripts]
codex-antigravity = "codex_antigravity_auth.cli:main"

[project.urls]
Homepage = "https://github.com/Reedtrullz/codex-antigravity-auth"
Repository = "https://github.com/Reedtrullz/codex-antigravity-auth"
Issues = "https://github.com/Reedtrullz/codex-antigravity-auth/issues"

[tool.setuptools.packages.find]
include = ["codex_antigravity_auth*"]

[tool.setuptools.package-data]
codex_antigravity_auth = [
  "skill_assets.json",
  "NATIVE_RESPONSES.md",
  "design/request-shapes.md",
  "design/tool-calls.md",
  "design/google-output.md",
  "design/capabilities.md",
  "design/orchestration.md",
  "PROCESS_LOGS.md",
  "REQUEST_DEADLINES.md",
  "design/model-discovery.md",
  "RESOURCE_LIMITS.md",
  "HTTP_CLIENTS.md",
  "CLI_JSON.md",
  "schemas/*.json",
  "SETUP.md",
  "skills/anti/SKILL.md",
  "skills/anti/RUN_CONTROL.md",
  "skills/anti/SPEND_CONTROL.md",
  "skills/anti/OWNERSHIP.md",
  "skills/anti/LOCAL_ONLY.md",
  "skills/anti/CONTEXT_PREFLIGHT.md",
  "skills/anti/CHUNK_RESUME.md",
  "skills/anti/ARTIFACTS.md",
  "skills/anti/WAV_AUDIO.md",
  "skills/anti/MUSIC_REVIEW.md",
  "skills/anti/ATTACHMENTS.md",
  "skills/anti/BENCHMARK.md",
  "skills/anti/DATA_POLICY.md",
  "skills/anti/SCOPES.md",
  "skills/anti/DIFF_PROVENANCE.md",
  "skills/anti/schemas/*.json",
  "skills/anti/agents/*.yaml",
  "skills/anti/scripts/*.py",
  "skills/anti/scripts/anti_lib/*.py",
  "skills/anti/scripts/anti_lib/*.json",
  "skills/anti/tests/*.py",
  "skills/anti/tests/fixtures/*.json",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# Start with correctness checks in the state/storage/protocol owners and CI
# helpers. Broaden this list in reviewed changes; no repository formatting gate.
[tool.ruff]
target-version = "py310"
include = [
  "codex_antigravity_auth/account_state.py",
  "codex_antigravity_auth/secure_store.py",
  "codex_antigravity_auth/storage.py",
  "codex_antigravity_auth/response_protocol.py",
  "codex_antigravity_auth/schema.py",
  "scripts/*.py",
  "tests/test_quality_gates.py",
]

[tool.ruff.lint]
select = ["F", "E9"]
